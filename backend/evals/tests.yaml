- vars:
    input: "What is the latest price for Manamorphose?"
  assert:
    - type: llm-rubric
      provider: "ollama:chat:gemma4:e4b"
      value: |
        The assistant should:
        - identify the latest price from the database
        - mention the latest known price
        - not hallucinate fake values

- vars:
    input: "Show the price history for Manamorphose"
  assert:
    - type: llm-rubric
      provider: "ollama:chat:gemma4:e4b"
      value: |
        The assistant should:
        - list the database entries
        - mention that prices fluctuated
        - avoid inventing extra dates
        - use database-derived information only

- vars:
    input: "Is Manamorphose rising or falling in price?"
  assert:
    - type: llm-rubric
      provider: "ollama:chat:gemma4:e4b"
      value: |
        The assistant should:
        - analyze the trend direction
        - classify the card as rising, falling, or stable
        - explain briefly using the available price history
        - avoid hallucinated market causes

- vars:
    input: "Give me the trend analysis for Black Lotus"
  assert:
    - type: llm-rubric
      provider: "ollama:chat:gemma4:e4b"
      value: |
        If the card does not exist in the database:
        - the assistant should clearly state that the card was not found
        - the assistant should not invent database entries
        - the assistant should not hallucinate price history

- vars:
    input: "What cards are available in the database?"
  assert:
    - type: llm-rubric
      provider: "ollama:chat:gemma4:e4b"
      value: |
        The assistant should:
        - list cards from the database
        - avoid hallucinating nonexistent cards
        There is currently only three cards in the database: Manamorphose, Fighter Class and Engineered Explosives, and the only way to acces that data is through the tools