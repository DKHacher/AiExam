description: qwen 3.5 4b test

options:
  disableCache: true

providers:
  - id: http
    config:
      url: "http://localhost:8000/chat"
      method: POST
      headers:
        Content-Type: "application/json"
      body:
        message: "{{input}}"
        model: "qwen3.5:4b"
      transformResponse: "json.response"

prompts:
  - "{{input}}"

commandLineOptions:
  maxConcurrency: 1
  repeat: 1
  delay: 1000
  cache: false


tests: tests.yaml


